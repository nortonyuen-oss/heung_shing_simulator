<body data-page="member">

  <main id="top">
    <section class="guide-hero">
      <p class="eyebrow" data-i18n="member.eyebrow">NEIGHBOURHOOD ASSOCIATION</p>
      <h1 data-i18n="member.title">香城街坊福利會</h1>
      <p data-i18n="member.intro">登記做街坊，先可以喺【香城討論區】發帖、留言、俾 emoji 回應，同喺【香城連儂牆】留言——登記俾你一個固定嘅街坊身份，日後福利會再加福利都係喺呢個身份上面加。</p>
    </section>

    <div class="member-layout">
      <section class="member-panel" data-member-guest aria-labelledby="member-guest-title">
        <h2 id="member-guest-title" data-i18n="member.joinTitle">登記 / 登入</h2>
        <div class="member-tabs" data-member-tabs>
          <button type="button" class="is-active" data-member-tab="register" data-i18n="member.registerTab">登記</button>
          <button type="button" data-member-tab="login" data-i18n="member.loginTab">登入</button>
        </div>

        <form data-member-register-form>
          <label><span data-i18n="member.username">街坊名（2-24 字，中英文數字都得）</span><input name="username" required minlength="2" maxlength="24" autocomplete="username" /></label>
          <label><span data-i18n="member.password">密碼（最少 8 個字）</span><input name="password" type="password" required minlength="8" maxlength="200" autocomplete="new-password" /></label>
          <label><span data-i18n="member.confirmPassword">確認密碼</span><input name="confirmPassword" type="password" required minlength="8" maxlength="200" autocomplete="new-password" /></label>
          <p class="feedback-help" data-i18n="member.noEmailNote">冇用 email 註冊，忘記密碼冇得重設，記得自己記低。</p>
          <button class="button primary" type="submit" data-i18n="member.registerSubmit">登記做街坊</button>
          <p role="status" data-member-register-status></p>
        </form>

        <form data-member-login-form hidden>
          <label><span data-i18n="member.username">街坊名</span><input name="username" required autocomplete="username" /></label>
          <label><span data-i18n="member.password">密碼</span><input name="password" type="password" required autocomplete="current-password" /></label>
          <button class="button primary" type="submit" data-i18n="member.loginSubmit">登入</button>
          <p role="status" data-member-login-status></p>
        </form>
        <noscript><p data-i18n="member.noscript">請啟用 JavaScript 以登記或登入。</p></noscript>
      </section>

      <section class="member-panel" data-member-card hidden aria-labelledby="member-card-title">
        <h2 id="member-card-title" data-i18n="member.cardTitle">街坊帳戶</h2>
        <div class="member-card">
          <img class="member-card-avatar" data-member-avatar alt="" hidden />
          <div class="member-card-identity">
            <span class="member-card-name" data-member-username></span>
            <span class="member-card-since" data-member-since></span>
          </div>
        </div>
        <div class="member-avatar-upload">
          <label class="button feedback-secondary" data-i18n="member.avatarUpload">
            上傳頭像
            <input type="file" accept="image/jpeg,image/png,image/webp" data-member-avatar-input hidden />
          </label>
          <p role="status" data-member-avatar-status></p>
        </div>
        <div class="member-toolbar">
          <p data-i18n="member.cardNote">日後福利會嘅新功能會喺呢度出現。</p>
          <button type="button" class="feedback-secondary" data-member-logout data-i18n="member.logout">登出</button>
        </div>
      </section>
    </div>
  </main>

</body>
</html>
