name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-website.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: synchronized-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Read published release metadata
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          current=$(node -p "'v'+require('./package.json').version")
          if [ "$latest" != "$current" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Game version is not published; keeping the existing official site."
            exit 0
          fi
          if gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir release --clobber; then
            node scripts/build-official-site.js release/release-manifest.json
          else
            node scripts/build-official-site.js
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: steps.published.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.published.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/site

      - name: Deploy to GitHub Pages
        if: steps.published.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
