name: Build Installers

on:
  workflow_dispatch:
    inputs:
      asset_run_id:
        description: Reuse assets after a CI/package verifier repair of the same release
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: synchronized-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check release tag and theme
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME!=='v'+p.version||!p.releaseTheme)process.exit(1)"
      - run: npm test

  assets:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .data/webp-cache
          key: baked-assets-${{ runner.os }}-${{ hashFiles('scripts/prepare-release-assets.js', 'Models/**') }}
          restore-keys: baked-assets-${{ runner.os }}-
      - name: Restore assets from the verified source revision
        if: inputs.asset_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_RUN: ${{ inputs.asset_run_id }}
        run: |
          [[ "$RELEASE_ASSET_RUN" =~ ^[0-9]+$ ]] || exit 1
          export RELEASE_ASSET_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_ASSET_RUN" --jq .head_sha)
          git fetch --no-tags --depth=1 origin "$RELEASE_ASSET_COMMIT"
          node -e 'const {execFileSync}=require("node:child_process"); const files=execFileSync("git",["diff","--name-only",process.env.RELEASE_ASSET_COMMIT,"HEAD"],{encoding:"utf8"}).trim().split("\n").filter(Boolean); const allowed=new Set([".github/workflows/build-installers.yml","scripts/verify-world-package.js"]); const isCheck=file=>allowed.has(file)||file.startsWith("test/")||(file.startsWith("scripts/smoke-")&&file.endsWith(".js")); if(files.some(file=>!isCheck(file)))throw Error("Asset source differs from this release; regenerate assets");'
          gh run download "$RELEASE_ASSET_RUN" --repo "$GITHUB_REPOSITORY" --name prepared-models --dir .data/package-assets/Models
          gh run download "$RELEASE_ASSET_RUN" --repo "$GITHUB_REPOSITORY" --name world-terrain --dir data/world-terrain
          node scripts/bake-road-line-textures.js
      - run: npm run prepare:release-assets
        if: inputs.asset_run_id == ''
      - run: npm run verify:release-assets
      - run: npm run verify:world-assets
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-models
          path: .data/package-assets/Models
          retention-days: 1
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: world-terrain
          path: data/world-terrain
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.os }} ${{ matrix.artifact }}
    needs: assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            command: npm run package:mac -- --arm64 --publish never
            artifact: mac-arm64-installers
          - os: macos-15
            command: npm run package:mac -- --x64 --publish never
            artifact: mac-x64-installers
          - os: windows-latest
            command: npm run package:win -- --publish never
            artifact: windows-installers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: prepared-models
          path: .data/package-assets/Models
      - uses: actions/download-artifact@v4
        with:
          name: world-terrain
          path: data/world-terrain
      - run: npm run verify:world-assets
      - run: ${{ matrix.command }}
        shell: bash
      - name: Verify packaged territory assets
        shell: bash
        run: |
          archive=$(find release -type f -name app.asar | head -n 1)
          test -n "$archive"
          node scripts/verify-world-package.js "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 1

  web:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: prepared-models
          path: .data/package-assets/Models
      - uses: actions/download-artifact@v4
        with:
          name: world-terrain
          path: data/world-terrain
      - run: npm run verify:world-assets
      - run: node scripts/restore-web-history.js
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build:web
        env:
          WEB_STATISTICS_ENABLED: 'true'
      - run: npm run verify:web
      - run: npx playwright-core install --with-deps chromium
      - name: Bauhinia medal cabinet
        run: node scripts/smoke-medal-cabinet.js
      - name: Lovers story illustrations
        run: node scripts/smoke-lovers-stories.js
      - name: Territory navigation
        run: npm run smoke:world:geography
      - name: Automatic territory development
        run: npm run smoke:world:growth
      - name: Browser save and backup verification
        run: |
          npm run preview:web > /tmp/static-web.log 2>&1 &
          npm run test:web
        env:
          WEB_SAVE_PATH: /tmp/web-smoke.heungshing
          WEB_SCREENSHOT_PATH: /tmp/web-smoke.png
      - name: Automatic Mobile Beta, construction and management
        run: |
          node scripts/smoke-mobile-auto.js
          node scripts/smoke-mobile-build.js
          node scripts/smoke-mobile-panels.js
          node scripts/smoke-mobile-bus.js
          node scripts/smoke-mobile-daily.js
          node scripts/smoke-mobile-rail.js
        env:
          MOBILE_TEST_URL: http://127.0.0.1:4173/
      - name: Official website languages and unavailable statistics
        run: |
          node scripts/build-official-site.js
          node scripts/smoke-official-site.js
      - name: Update and storage failure protection
        run: node scripts/smoke-web-safety.js
      - run: tar -czf release/web-candidate.tar.gz -C release web
      - uses: actions/upload-artifact@v4
        with:
          name: web-candidate
          path: release/web-candidate.tar.gz
          retention-days: 1

  edge:
    name: Verify Microsoft Edge on Windows
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-candidate
          path: artifacts
      - name: Browser save and backup verification in Edge
        shell: bash
        run: |
          mkdir -p release
          tar -xzf artifacts/web-candidate.tar.gz -C release
          npm run preview:web > edge-preview.log 2>&1 &
          npm run test:web
        env:
          WEB_TEST_BROWSER: msedge
          WEB_SAVE_PATH: ${{ runner.temp }}/edge-smoke.heungshing
          WEB_SCREENSHOT_PATH: ${{ runner.temp }}/edge-smoke.png

  android:
    # 香城模擬器 for Android (android/README.md): a Trusted Web Activity on the browser version, signed
    # with the release key from the repository's secrets
    name: Build Android app
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and sign the APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing GitHub Actions secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          export ANDROID_KEYSTORE="$RUNNER_TEMP/heungshing-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          version="$(node -p "require('./package.json').version")"
          (cd android/twa && ./gradlew assembleRelease --no-daemon)
          mkdir -p release-android
          apk="release-android/The.City.of.Heung.Shing-${version}-android.apk"
          cp android/twa/app/build/outputs/apk/release/app-release.apk "$apk"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          # signed with the key the site vouches for (android/assetlinks.json), or Chrome shows a URL bar
          expected="$(node -p "require('./android/assetlinks.json')[0].target.sha256_cert_fingerprints[0].replace(/:/g, '').toLowerCase()")"
          "$build_tools/apksigner" verify --print-certs "$apk" | grep -i "SHA-256 digest: ${expected}"
          rm -f "$ANDROID_KEYSTORE"
          ls -lh release-android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-android/*.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish synchronized release
    needs: [build, web, edge, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a6d7368702ab8725c1e8188b30da7edd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify deployment authorization
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          npx wrangler whoami
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          mac_arm64_dmg="$(find artifacts/mac-arm64-installers -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          mac_x64_dmg="$(find artifacts/mac-x64-installers -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          win_setup="$(find artifacts/windows-installers -maxdepth 1 -type f -name '*Setup*.exe' | head -n 1)"
          win_portable="$(find artifacts/windows-installers -maxdepth 1 -type f -name '*.exe' ! -name '*Setup*' | head -n 1)"
          win_latest="$(find artifacts/windows-installers -maxdepth 1 -type f -name 'latest.yml' | head -n 1)"
          win_setup_blockmap="$(find artifacts/windows-installers -maxdepth 1 -type f -name '*Setup*.exe.blockmap' | head -n 1)"
          android_apk="$(find artifacts/android-apk -maxdepth 1 -type f -name '*-android.apk' | head -n 1)"
          test -n "$mac_arm64_dmg"
          test -n "$mac_x64_dmg"
          test -n "$win_setup"
          test -n "$win_portable"
          test -n "$win_latest"
          test -n "$win_setup_blockmap"
          test -n "$android_apk"
          setup_public="The.City.of.Heung.Shing.Setup.${version}.exe"
          cp "$mac_arm64_dmg" "release-assets/The.City.of.Heung.Shing-${version}-arm64.dmg"
          cp "$mac_x64_dmg" "release-assets/The.City.of.Heung.Shing-${version}-x64.dmg"
          cp "$win_setup" "release-assets/${setup_public}"
          cp "$win_portable" "release-assets/The.City.of.Heung.Shing.${version}.exe"
          cp "$win_setup_blockmap" "release-assets/${setup_public}.blockmap"
          cp "$win_latest" "release-assets/latest.yml"
          cp "$android_apk" "release-assets/The.City.of.Heung.Shing-${version}-android.apk"
          OLD_SETUP="$(basename "$win_setup")" \
          OLD_BLOCKMAP="$(basename "$win_setup_blockmap")" \
          SETUP_PUBLIC="$setup_public" \
          perl -0pi -e 's/\Q$ENV{OLD_SETUP}\E/$ENV{SETUP_PUBLIC}/g; s/\Q$ENV{OLD_BLOCKMAP}\E/$ENV{SETUP_PUBLIC}.blockmap/g; s/^(\s*-\s*url:\s*).*?$/$1$ENV{SETUP_PUBLIC}/mg; s/^(path:\s*).*?$/$1$ENV{SETUP_PUBLIC}/mg' release-assets/latest.yml
          ls -lh release-assets

      - name: Prepare full draft release
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            release_title="$(sed -n '1s/^# //p' RELEASE_NOTES.md)"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$release_title" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
          mkdir -p release
          tar -xzf artifacts/web-candidate/web-candidate.tar.gz -C release
          cp artifacts/web-candidate/web-candidate.tar.gz release-assets/web-assets.tar.gz
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release-assets/web-assets.tar.gz
      - name: Deploy statistics without resetting counts
        run: |
          npx wrangler d1 migrations apply heung-shing-statistics --remote --config services/statistics/wrangler.jsonc
          version=$(node -p "require('./package.json').version")
          npx wrangler deploy --config services/statistics/wrangler.jsonc --var "GAME_VERSIONS:$version"
      - name: Deploy verified static game
        run: |
          node scripts/deploy-web-release.js
      - name: Publish complete release and prepare official site
        run: |
          node scripts/create-release-manifest.js
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/release-manifest.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          node scripts/build-official-site.js release/release-manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: release/site
      # Pages can list artifacts before a newly finalized upload becomes visible:
      # https://github.com/actions/deploy-pages/issues/451
      - name: Wait for the Pages artifact to become discoverable
        env:
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" --jq '.artifacts | map(select(.expired == false)) | length' | grep -qx 1; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The Pages artifact is not discoverable after 60 seconds."
          exit 1
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Record verified release locations
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,tagName
          curl --fail --silent https://heung-shing-play.nortonyuen.workers.dev/data/app-info.json
